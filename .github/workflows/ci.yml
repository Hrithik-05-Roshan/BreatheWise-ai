name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Verification
        run: npm run typecheck

      - name: Unit, Integration & Security Tests
        run: npm test

      - name: Production Build Compilation
        run: npm run build

      - name: Runtime Vulnerability Audit
        run: npm run audit
